name: Build Windows downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files-loopback:
    name: Build Files loopback extension
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and verify extension twice
        id: build
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.5') {
              throw "PowerShell 7.5 or newer is required; found $($PSVersionTable.PSVersion)."
          }
          $build = & ./scripts/Build-RemarkableFilesLoopback.ps1 -Force
          if (-not $build.TwoCleanBuildsHashIdentical -or
              -not $build.NetworkDisabledDuringCompilation) {
              throw 'The Files loopback build did not report both deterministic-build checks.'
          }
          "sha256=$($build.Sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload verified extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remarkable-files-loopback
          path: tmp/mirror/files-loopback/rmmirror-files-loopback.so
          if-no-files-found: error
          retention-days: 1

  windows-downloads:
    name: Build Windows downloads
    needs: files-loopback
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: |
            mirror/windows/ReMarkableMirror/packages.lock.json
            mirror/windows/ReMarkableMirror/packages.portable.lock.json

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.5
          check-latest: false
          cache: false

      - name: Download verified extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remarkable-files-loopback
          path: ${{ runner.temp }}/remarkable-files-loopback

      - name: Build complete Windows downloads
        shell: pwsh
        env:
          FILES_LOOPBACK_SHA256: ${{ needs.files-loopback.outputs.sha256 }}
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.5') {
              throw "PowerShell 7.5 or newer is required; found $($PSVersionTable.PSVersion)."
          }
          $prebuilt = Join-Path $env:RUNNER_TEMP 'remarkable-files-loopback/rmmirror-files-loopback.so'
          $output = Join-Path $env:RUNNER_TEMP 'remarkable-mirror-package'
          & ./scripts/Build-RemarkableMirrorPackage.ps1 `
              -OutputDirectory $output `
              -PrebuiltFilesLoopbackPath $prebuilt `
              -PrebuiltFilesLoopbackSha256 $env:FILES_LOOPBACK_SHA256

          $releaseDirectories = @(Get-ChildItem -LiteralPath $output -Directory -Filter 'ReMarkableMirror-*-x64')
          $releaseArchives = @(Get-ChildItem -LiteralPath $output -File -Filter 'ReMarkableMirror-*-x64.zip')
          $portableExecutables = @(Get-ChildItem -LiteralPath $output -File -Filter 'ReMarkableMirror.exe')
          if ($releaseDirectories.Count -ne 1 -or
              $releaseArchives.Count -ne 1 -or
              $portableExecutables.Count -ne 1) {
              throw 'Packaging did not produce exactly one installer folder, matching ZIP, and portable executable.'
          }
          foreach ($requiredRelativePath in @(
                  'Install.cmd',
                  'Install-RemarkableMirror.ps1',
                  'release.json',
                  'ReMarkableMirror.cer'
              )) {
              $requiredPath = Join-Path $releaseDirectories[0].FullName $requiredRelativePath
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                  throw "Installer folder is missing: $requiredRelativePath"
              }
          }
          $applicationPackages = @(Get-ChildItem -LiteralPath $releaseDirectories[0].FullName -File -Filter '*.msix')
          if ($applicationPackages.Count -ne 1) {
              throw "Installer folder contains $($applicationPackages.Count) application MSIX files instead of one."
          }

          $releaseMetadata = Get-Content -LiteralPath (Join-Path $releaseDirectories[0].FullName 'release.json') -Raw |
              ConvertFrom-Json
          $portableHash = (Get-FileHash -LiteralPath $portableExecutables[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($releaseMetadata.portable.file -cne $portableExecutables[0].Name -or
              $releaseMetadata.portable.sha256 -cne $portableHash) {
              throw 'The portable executable does not match release.json.'
          }
          $portableOutput = Join-Path $env:RUNNER_TEMP 'remarkable-mirror-portable'
          New-Item -ItemType Directory -Path $portableOutput -Force | Out-Null
          Copy-Item -LiteralPath $portableExecutables[0].FullName -Destination (Join-Path $portableOutput 'ReMarkableMirror.exe')
          "Portable EXE size: $([Math]::Round($portableExecutables[0].Length / 1MB, 2)) MiB" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Portable EXE SHA-256: ``$portableHash``" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Launch-smoke portable executable
        shell: pwsh
        run: |
          $portableExe = Join-Path $env:RUNNER_TEMP 'remarkable-mirror-portable/ReMarkableMirror.exe'
          $blockedDotnetRoot = Join-Path $env:RUNNER_TEMP 'no-shared-dotnet-runtime'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'remarkable-mirror-portable-extract'
          New-Item -ItemType Directory -Path $blockedDotnetRoot, $extractRoot -Force | Out-Null
          $env:DOTNET_ROOT = $blockedDotnetRoot
          $env:DOTNET_ROOT_X64 = $blockedDotnetRoot
          $env:DOTNET_MULTILEVEL_LOOKUP = '0'
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = $extractRoot
          $process = Start-Process -FilePath $portableExe -PassThru
          try {
              $deadline = [DateTime]::UtcNow.AddSeconds(10)
              do {
                  Start-Sleep -Milliseconds 250
                  $process.Refresh()
                  if ($process.HasExited) {
                      throw "Portable ReMarkableMirror.exe exited during launch smoke with code $($process.ExitCode)."
                  }
              } while ([DateTime]::UtcNow -lt $deadline)

              if ($process.MainWindowHandle -eq [IntPtr]::Zero) {
                  throw 'Portable ReMarkableMirror.exe did not open its main window during launch smoke.'
              }

              $prerequisiteBundles = @(
                  Get-ChildItem -LiteralPath $extractRoot -Directory -Recurse |
                      Where-Object Name -ceq 'TabletPrerequisites'
              )
              if ($prerequisiteBundles.Count -ne 1) {
                  throw "Portable launch extracted $($prerequisiteBundles.Count) TabletPrerequisites bundles instead of one."
              }
              $process.Refresh()
              if ($process.HasExited) {
                  throw "Portable ReMarkableMirror.exe exited during launch smoke with code $($process.ExitCode)."
              }
              if ($process.MainWindowHandle -eq [IntPtr]::Zero) {
                  throw 'Portable ReMarkableMirror.exe closed its main window during launch smoke.'
              }
          }
          finally {
              $process.Refresh()
              if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force
                  [void]$process.WaitForExit(5000)
              }
          }
          'Portable clean-runner launch smoke: passed with a live main window, shared .NET lookup blocked, and prerequisite payload extracted.' |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload portable Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remarkable-mirror-portable-windows-x64
          path: ${{ runner.temp }}/remarkable-mirror-portable/ReMarkableMirror.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remarkable-mirror-windows-installer
          path: ${{ runner.temp }}/remarkable-mirror-package/ReMarkableMirror-*-x64.zip
          if-no-files-found: error
          retention-days: 30
