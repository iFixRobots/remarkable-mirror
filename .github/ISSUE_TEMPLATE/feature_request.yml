name: Feature request
description: Propose a focused user-facing improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is awkward today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user experience, not only an implementation.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Tablet model
      placeholder: Paper Pro Move

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
