name: Feature request
description: Propose a focused user-facing improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        reMarkable Mirror has native Windows and macOS desktop apps. Windows has the complete installer/setup path; the current macOS development build is unsigned. Small ARM64 Linux components run on the tablet and support both apps. Report security problems privately through the Security tab.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is awkward today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user experience, not only an implementation.
    validations:
      required: true

  - type: dropdown
    id: host-platform
    attributes:
      label: Host platform
      options:
        - Windows 11 x64
        - macOS on Apple silicon (unsigned development build)
        - Linux desktop (not currently available)
        - Tablet-side Linux runtime
        - Cross-platform or not applicable
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Tablet model
      placeholder: Paper Pro Move

  - type: input
    id: firmware
    attributes:
      label: Tablet firmware version
      placeholder: Optional when the request is not firmware-specific

  - type: dropdown
    id: route
    attributes:
      label: Connection route
      options:
        - USB-C
        - Wi-Fi
        - Route switching
        - Both routes
        - Not applicable

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include credentials, document data, IP addresses, personal network details, device identifiers, or unreviewed diagnostics.
          required: true
